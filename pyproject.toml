[project]
name = "opportunity-radar"
version = "0.1.0"
description = "AI-powered opportunity radar — content and product discovery briefings"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "anthropic>=0.96.0",
    "apscheduler>=3.10",
    "asyncpg>=0.31.0",
    "cachetools>=7.0.6",
    "email-validator>=2.0",
    "fastapi>=0.136.0",
    "google-api-python-client>=2.194.0",
    "google-api-python-client-stubs>=1.35.0",
    "httpx>=0.28.1",
    "plotly>=6.7.0",
    "praw>=7.8.1",
    "pydantic-settings>=2.14.0",
    "pytrends>=4.9.2",
    "serpapi>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.49",
    "streamlit>=1.56.0",
    "redis[asyncio]>=5.0.0",
    "sentry-sdk[fastapi]>=1.40.0",
    "slowapi>=0.1.9",
    "structlog>=24.0.0",
    "supabase>=2.10.0",
    "uvicorn>=0.45.0",
    "resend>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S"]
ignore = [
    "S101",  # assert used in tests
    "S105",  # hardcoded passwords — false positives on env-var defaults
    "S106",  # hardcoded passwords — false positives on env-var defaults
    "S311",  # standard pseudo-random generators (not used for crypto)
    "B008",  # FastAPI Depends() in function defaults — intentional pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*"                              = ["S", "B", "E501"]
"alembic/*"                            = ["E501", "I001"]
"dashboard.py"                         = ["S", "B", "E501", "UP", "E701"]
"src/infrastructure/email_service.py"  = ["E501", "B904"]
"src/infrastructure/adapters/*.py"       = ["E501", "B904", "S110"]
"src/infrastructure/db/models.py"        = ["E501"]
"src/infrastructure/db/*.py"             = ["E501"]
"src/infrastructure/niche_templates.py"  = ["E501"]
"src/infrastructure/scheduler/*.py"      = ["E501"]
"src/infrastructure/*.py"                = ["E501", "B904"]
"src/api/routes/*.py"                    = ["E501", "B904"]
"src/application/use_cases/*.py"         = ["E501"]
"src/main.py"                            = ["E501"]
"scripts/*.py"                           = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
